{% extends "base.html" %}
{%block title %}List contracts{% endblock %}
{% block content %}
<h1 align="center">Contracts</h1>
<ul class="list-group list-group-flush" id="notes">
    {% for contract in user.contracts %}
    <li class="list-group-item">Address: {{ contract.address}} Deployer: {{user.username}} Date: {{contract.time}}</li>
    {% endfor %}
</ul>
{% endblock %}

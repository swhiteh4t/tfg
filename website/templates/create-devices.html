{% extends "base.html" %}
{%block title %}Home{% endblock %}
{% block content %}
<h1 align="center">Create a new device</h1>
<form method="POST">
    <div class="form-group">
        <label for="hostname">Device name</label>
        <input type="hostname" class="form-control" id="hostname" name="hostname" placeholder="Enter hostname">
    </div>
    <br />
    <select class="form-select" aria-label="Select Contract" name="contract-selection" required>
        <option selected>Select a contract address</option>
        {% for contract.address in user.contracts %}
        <option value="{{contract.address}}">{{contract.address}}</option>
        {% endfor %}
      </select>
    <br />
    <button type="submit" class="btn btn-primary">Log in</button>
</form>
{% endblock %}

{% extends "base.html" %}
{%block title %}List certificates{% endblock %}
{% block content %}
<h1 align="center">Certificates</h1>
<ul class="list-group list-group-flush" id="notes">
    {% for certificate in certificates %}
    <li class="list-group-item">Hash: {{ certificate.hash}}</li>
    {% endfor %}
</ul>
{% endblock %}

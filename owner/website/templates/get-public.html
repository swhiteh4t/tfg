{% extends "base.html" %}
{%block title %}Public{% endblock %}
{% block content %}
<h4 align="center">Public key {{public}}</h4>
</br>
<form method="POST">
    <div class="form-group">
        <label for="password">Password of private key</label>
        <input type="password" class="form-control" id="password" name="password"
            placeholder="Enter Password of private key">
    </div>
    <br />
    <button type="submit" class="btn btn-primary">Set</button>
</form>
{% endblock %}

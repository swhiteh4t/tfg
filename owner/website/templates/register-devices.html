{% extends "base.html" %}
{%block title %}Create device{% endblock %}
{% block content %}
<h1 align="center">Create a new device</h1>
<form method="POST">
    <div class="form-group">
        <label for="hostname">Device name</label>
        <input type="hostname" class="form-control" id="hostname" name="hostname" placeholder="Enter hostname">
    </div>
    <br />
    <div class="form-group">
        <label for="device-address">Device's device address</label>
        <input type="device-address" class="form-control" id="device-address" name="device-address"
            placeholder="Device blockchain address">
    </div>
    <br />
    <div class="form-group">
        <label for="public">Device's public key</label>
        <input type="public" class="form-control" id="public" name="public" placeholder="Device public key">
    </div>
    <br />
    <button type="submit" class="btn btn-primary">Deploy</button>
</form>
{% endblock %}
